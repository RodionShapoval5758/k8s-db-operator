apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: manageddatabases.demo.example.com
spec:
  group: demo.example.com
  scope: Namespaced
  names:
    kind: ManagedDatabase
    listKind: ManagedDatabaseList
    plural: manageddatabases
    singular: manageddatabase
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Engine
      type: string
      jsonPath: .spec.engine
    - name: Size
      type: integer
      jsonPath: .spec.sizeGB
    - name: State
      type: string
      jsonPath: .status.state
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          spec:
            type: object
            required: [engine, sizeGB]
            properties:
              engine:
                type: string
                minLength: 1
              sizeGB:
                type: integer
                minimum: 1
          status:
            type: object
            properties:
              state:
                type: string
              databaseID:
                type: string
              endpoint:
                type: string
              message:
                type: string
